<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Aptean Global Partner Program — Partner Hub concept prototype.">
<title>Aptean Partner Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
/* ══════════ TOKENS ══════════ */
:root{
  color-scheme: light;
  --navy:#1D3251; --teal:#34718C; --coral:#DA7758; --sky:#54A4DB; --gold:#E5C179;
  --acc:#34718C; --acc-2:#DA7758;
  --ink:#101820; --ink-2:#55636F; --ink-3:#8B98A4;
  --page:#EEF1F4; --surface:#FFFFFF; --raise:#FFFFFF; --sunk:#F5F7F9;
  --line:#DFE5EA; --line-2:#EDF1F4;
  --bar:#1B2E49; --bar-2:#24405F; --bar-ink:#FFFFFF;
  --grad:linear-gradient(105deg,#1D3251 0%,#34718C 52%,#DA7758 100%);
  --grad-v:linear-gradient(180deg,#1D3251,#34718C);
  --wash:rgba(52,113,140,.09);
  --ok:#2E7D5B; --ok-bg:rgba(46,125,91,.11);
  --warn:#9A6410; --warn-bg:rgba(229,193,121,.24);
  --hot:#B4482A; --hot-bg:rgba(218,119,88,.14);
  --sh-1:0 1px 2px rgba(16,24,32,.05);
  --sh-2:0 1px 2px rgba(16,24,32,.05), 0 10px 26px -18px rgba(29,50,81,.35);
  --sh-3:0 30px 70px -32px rgba(16,24,32,.45);
  --r:13px; --r-s:9px; --lgf:none;
}
:root[data-t="dark"]{
  color-scheme: dark;
  --teal:#5AA0BC; --coral:#E9906E; --sky:#79BEEB; --gold:#EBCE93;
  --acc:#5AA0BC; --acc-2:#E9906E;
  --ink:#EDF2F7; --ink-2:#9BAABA; --ink-3:#6E7F90;
  --page:#080C12; --surface:#111A25; --raise:#16212E; --sunk:#0D151E;
  --line:#233043; --line-2:#1A2534;
  --bar:#0D1620; --bar-2:#132030; --bar-ink:#EDF2F7;
  --grad:linear-gradient(105deg,#1D3251 0%,#34718C 52%,#DA7758 100%);
  --grad-v:linear-gradient(180deg,#24455F,#3D7E9B);
  --wash:rgba(90,160,188,.12);
  --ok:#5FC79A; --ok-bg:rgba(95,199,154,.14);
  --warn:#E5C179; --warn-bg:rgba(229,193,121,.15);
  --hot:#F0A183; --hot-bg:rgba(233,144,110,.15);
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -20px rgba(0,0,0,.9);
  --sh-3:0 30px 70px -30px rgba(0,0,0,.95); --lgf:invert(1) brightness(1.9);
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0; background:var(--page); color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; transition:background .2s,color .2s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}

/* ══════════ TOP BAR ══════════ */
.bar{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:8px;padding:0 20px;
  background:linear-gradient(92deg,var(--bar) 0%,var(--bar-2) 55%,var(--bar) 100%);color:var(--bar-ink);
  border-bottom:1px solid rgba(255,255,255,.07)}
.bar .lg{height:18px;width:auto;display:block}
.bar .vr{width:1px;height:20px;background:rgba(255,255,255,.16);margin:0 14px 0 16px}
.bar .pn{font-size:13.5px;font-weight:600;letter-spacing:-.005em;color:rgba(255,255,255,.92);white-space:nowrap}
.bar nav{display:flex;gap:3px;margin-left:26px;margin-right:auto;height:100%}
.bar nav button{position:relative;padding:0 14px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.62);
  display:flex;align-items:center;transition:color .15s}
.bar nav button:hover{color:rgba(255,255,255,.92)}
.bar nav button.on{color:#fff;font-weight:600}
.bar nav button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2.5px;border-radius:2px 2px 0 0;background:var(--grad)}
.tr{display:flex;align-items:center;gap:7px}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:rgba(255,255,255,.72);position:relative;transition:.15s}
.ib:hover{background:rgba(255,255,255,.11);color:#fff}
.ib .dt{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--bar)}
.regbtn{display:inline-flex;align-items:center;gap:7px;background:var(--grad);color:#fff;font-size:13px;font-weight:700;
  border-radius:999px;padding:8px 16px;box-shadow:0 6px 18px -8px rgba(218,119,88,.8);white-space:nowrap}
.regbtn:hover{filter:brightness(1.09)}
.langwrap{position:relative}
.langbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:9px;color:rgba(255,255,255,.78);
  font-size:12px;font-weight:700;letter-spacing:.04em;transition:.15s}
.langbtn:hover{background:rgba(255,255,255,.11);color:#fff}
.langmenu{position:absolute;right:0;top:42px;min-width:190px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--sh-3);padding:5px;display:none;z-index:50}
.langmenu.on{display:block}
.langmenu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:8px 11px;
  border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink)}
.langmenu button:hover{background:var(--sunk)}
.langmenu button.on{background:var(--wash);font-weight:700;color:var(--acc)}
.langmenu button i{font-style:normal;font-size:10px;color:var(--ink-3);font-weight:500}
.org{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 5px;border-radius:999px;background:rgba(255,255,255,.10);margin-left:5px}
.org .av{width:27px;height:27px;border-radius:50%;background:var(--grad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.org > span:last-child{display:flex;flex-direction:column;line-height:1.15}
.org .nm{display:block;font-size:12.5px;font-weight:600;line-height:1.2}
.org .tt{display:block;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}

/* ══════════ LAYOUT ══════════ */
.wrap{max-width:1460px;margin:0 auto;padding:18px 20px 96px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:26px 0 12px}
.sh h2{font-size:16px;font-weight:800}
.sh .hint{font-size:12.5px;color:var(--ink-2)}
.lk{font-size:12.5px;font-weight:600;color:var(--acc)}
.lk:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--sh-1)}
.kick{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ══════════ HERO STRIP ══════════ */
.hero{position:relative;border-radius:16px;overflow:hidden;color:#fff;box-shadow:var(--sh-2)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 38%}
.hero .vl{position:absolute;inset:0;background:linear-gradient(96deg,rgba(10,20,33,.93) 0%,rgba(18,44,62,.72) 52%,rgba(30,42,56,.42) 100%)}
.hero .in{position:relative;padding:18px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px}
.hero h1{font-size:23px;font-weight:800;line-height:1.1}
.hero .sub{font-size:12.5px;color:rgba(255,255,255,.74);margin-top:3px}
.ents{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center}
.ep{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;letter-spacing:.01em}
.ep.on{background:rgba(255,255,255,.19);border:1px solid rgba(255,255,255,.26)}
.ep.off{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.24);color:rgba(255,255,255,.5)}
.ep.gold{background:rgba(229,193,121,.2);border:1px solid rgba(229,193,121,.5);color:#F7E7C4}
.ents .sep{width:1px;height:15px;background:rgba(255,255,255,.2);margin:0 4px}
.ents .mg{font-size:11px;font-weight:600;color:rgba(255,255,255,.62);border-bottom:1px dotted rgba(255,255,255,.4)}
.ents .mg:hover{color:#fff}
.hstats{display:flex;gap:22px;margin-left:auto}
.hstat .v{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hstat .l{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:1px}
.ticker{position:relative;display:flex;align-items:center;gap:11px;padding:9px 24px;background:rgba(0,0,0,.28);
  border-top:1px solid rgba(255,255,255,.10);font-size:12.5px}
.ticker .tag{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--coral);color:#fff;padding:2px 7px;border-radius:4px}
.ticker .tx{color:rgba(255,255,255,.9);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticker .mo{margin-left:auto;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.66);white-space:nowrap}

/* ══════════ GAUGE CLUSTER ══════════ */
.gauges{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin-top:12px}
.g{background:var(--surface);border:1px solid var(--line-2);border-radius:11px;padding:10px 12px 11px;box-shadow:var(--sh-1);
  display:flex;flex-direction:column;transition:.15s;min-width:0}
.g:hover{box-shadow:var(--sh-2);border-color:var(--line)}
.g .gl{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .gv{font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.15;margin-top:3px}
.g .gv i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:2px}
.g .gt{height:3px;border-radius:2px;background:var(--line);margin-top:8px;position:relative;overflow:hidden}
.g .gt i{position:absolute;inset:0 auto 0 0;border-radius:2px}
.g .gs{font-size:10.5px;color:var(--ink-2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .gs.hot{color:var(--hot);font-weight:600}

/* ══════════ BOARD ══════════ */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{background:var(--sunk);border:1px solid var(--line-2);border-radius:15px;padding:12px;display:flex;flex-direction:column;gap:9px}
.colh{display:flex;align-items:center;gap:9px;padding:2px 4px 8px}
.colh .cd{width:9px;height:9px;border-radius:3px;flex:none}
.colh .cn{font-size:13px;font-weight:800;letter-spacing:-.01em}
.colh .cc{font-size:10.5px;font-weight:700;color:var(--ink-3);background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:1px 7px}
.colh .cg{margin-left:auto;font-size:11px;font-weight:600;color:var(--acc)}
.colh .cg:hover{text-decoration:underline}
.deal{background:var(--surface);border:1px solid var(--line-2);border-radius:11px;padding:12px 13px 13px;width:100%;
  box-shadow:var(--sh-1);transition:.15s;display:block}
.deal:hover{box-shadow:var(--sh-2);transform:translateY(-1px);border-color:var(--line)}
.deal .d1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.deal .dn{font-size:13.5px;font-weight:700;letter-spacing:-.012em;line-height:1.25}
.deal .dv{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.deal .d2{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;align-items:center}
.pc{font-size:9.5px;font-weight:700;letter-spacing:.05em;border-radius:4px;padding:2px 6px;background:var(--wash);color:var(--acc)}
.pc.gr{background:var(--line-2);color:var(--ink-3)}
.deal .stg{font-size:11.5px;color:var(--ink-2);margin-top:9px}
.deal .stg b{color:var(--ink);font-weight:700}
.deal .nxt{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;font-weight:600;color:var(--acc-2)}
.deal .pr{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
.deal .pr i{display:block;height:100%;border-radius:2px}
.deal .mt{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--ink-3)}
.newdeal{border:1.5px dashed var(--line);border-radius:11px;padding:14px;text-align:center;font-size:12.5px;font-weight:600;
  color:var(--ink-2);background:transparent;width:100%;transition:.15s}
.newdeal:hover{border-color:var(--acc);color:var(--acc);background:var(--wash)}

/* ══════════ CERTIFICATIONS ══════════ */
.certs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ct{padding:16px 18px 17px;position:relative;overflow:hidden}
.ct .cs{position:absolute;inset:0 0 auto 0;height:3px}
.ct .ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:5px}
.ct .ctn{font-size:14.5px;font-weight:800}
.ct .ctk{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.ct .rt{text-align:right;white-space:nowrap}
.ct .rt b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.ct .rt span{font-size:10px;font-weight:600;color:var(--ink-3);display:block;letter-spacing:.05em;text-transform:uppercase}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.crow:last-of-type{border-bottom:0}
.crow .cnm{flex:1;min-width:0}
.crow .cq{font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap}
.cq.hold{background:var(--ok-bg);color:var(--ok)}
.cq.part{background:var(--warn-bg);color:var(--warn)}
.cq.gap{background:var(--hot-bg);color:var(--hot)}
.ct .cf{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:11px;border-top:1px solid var(--line-2)}
.ct .cf .nt{font-size:11px;color:var(--ink-3);line-height:1.45}
.mini{font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:6px 13px;white-space:nowrap}
:root[data-t="dark"] .mini{background:var(--acc);color:#08131a}
.mini:hover{filter:brightness(1.12)}

/* ══════════ SIDE WIDGETS ══════════ */
.duo{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.wg{padding:14px 16px 15px}
.wg h4{font-size:12.5px;font-weight:800;margin-bottom:2px}
.wg .wsub{font-size:11px;color:var(--ink-3);margin-bottom:10px}
.dm{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.dm:last-child{border-bottom:0}
.dm .dd{width:6px;height:6px;border-radius:50%;flex:none}
.dm .dnm{font-size:11.5px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em}
.dm .dex{margin-left:auto;font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.dm .dex.soon{color:var(--hot);font-weight:700}
.dm .go{font-size:10.5px;font-weight:700;color:var(--acc)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.qb{border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:11.5px;font-weight:600;display:flex;
  align-items:center;gap:8px;background:var(--surface);transition:.15s}
.qb:hover{border-color:var(--acc);color:var(--acc);background:var(--wash)}
.qb svg{color:var(--acc);flex:none}

/* ══════════ NEWS FULL WIDTH ══════════ */
.newsband{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--sh-1)}
.nbh{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--grad);color:#fff}
.nbh h3{font-size:14px;font-weight:800;letter-spacing:-.01em}
.nbh .nk{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.nbh .all{margin-left:auto;font-size:11.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 13px}
.nbh .all:hover{background:rgba(255,255,255,.32)}
.nbb{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:0}
.nb{padding:16px 20px 18px;border-right:1px solid var(--line-2);min-width:0}
.nb:last-child{border-right:0}
.nb .nm{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.nb .nm .pill{padding:2px 7px;border-radius:4px;color:#fff}
.nb h4{font-size:14px;font-weight:700;margin-top:9px;line-height:1.35}
.nb.big h4{font-size:16.5px}
.nb p{margin:7px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.nb .rd{margin-top:11px;font-size:11.5px;font-weight:700;color:var(--acc)}

/* ══════════ DEAL WORKSPACE ══════════ */
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:12px}
.crumb button{font-weight:600;color:var(--acc)} .crumb button:hover{text-decoration:underline}
.dhead{border-radius:16px;overflow:hidden;color:#fff;box-shadow:var(--sh-2);position:relative}
.dhead .bg{position:absolute;inset:0;background:var(--grad)}
.dhead .in{position:relative;padding:18px 24px;display:flex;flex-wrap:wrap;gap:16px 26px;align-items:center}
.dhead h1{font-size:22px;font-weight:800}
.dhead .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.dhead .st{display:flex;gap:20px;margin-left:auto}
.dhead .st .v{font-size:19px;font-weight:800;letter-spacing:-.03em}
.dhead .st .l{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.phases{display:flex;gap:0;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:5px;margin:14px 0 16px;box-shadow:var(--sh-1)}
.ph{flex:1;padding:10px 14px;border-radius:9px;display:flex;align-items:center;gap:11px;transition:.15s;min-width:0}
.ph:hover:not(.lock){background:var(--sunk)}
.ph.on{background:var(--wash)}
.ph.lock{opacity:.45;cursor:not-allowed}
.ph .pi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;color:#fff}
.ph > span:nth-child(2){display:flex;flex-direction:column;min-width:0}
.ph .pt{display:block;font-size:12.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .ps{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.ph .pbar{margin-left:auto;width:46px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.ph .pbar i{display:block;height:100%;border-radius:2px}

.flow{display:grid;grid-template-columns:1fr 348px;gap:16px;align-items:start}
.rail{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:38px 1fr;gap:14px;padding-bottom:12px}
.step:last-child{padding-bottom:0}
.spine{display:flex;flex-direction:column;align-items:center;gap:5px}
.spine .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;
  background:var(--surface);border:2px solid var(--line);color:var(--ink-3);flex:none;z-index:2;transition:.15s}
.spine .th{width:2px;flex:1;background:var(--line);border-radius:2px;min-height:12px}
.step.done .n{background:var(--acc);border-color:var(--acc);color:#fff}
.step.done .th{background:var(--acc);opacity:.35}
.step.active .n{background:var(--acc-2);border-color:var(--acc-2);color:#fff;box-shadow:0 0 0 4px var(--hot-bg)}
.sc{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px 16px 15px;width:100%;transition:.15s}
.sc:hover{box-shadow:var(--sh-2);border-color:var(--line)}

.rfxstat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:3px}
.rfxstat b em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-2);margin-left:2px}
.rfxstat i{font-style:normal;font-size:11px;font-weight:700;color:var(--acc)}
.rfxrow{display:grid;grid-template-columns:1fr 100px 94px;align-items:center;gap:11px;padding:7px 0}
.rfxc{font-size:12.5px;font-weight:600}
.rfxt{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.rfxt i{display:block;height:100%;border-radius:4px;background:var(--teal)}
.rfxv{text-align:right} .rfxv b{font-size:12.5px;font-weight:700}
.rfxv span{display:block;font-size:10px;font-weight:700}
.rfxv .gap{color:var(--hot)} .rfxv .ok{color:var(--ok)}
.rfxgap{background:var(--surface);border:1px solid var(--line-2);border-left:3px solid var(--coral);border-radius:10px;
  padding:12px 14px;margin-bottom:8px}
.rfxgap b{display:block;font-size:12.5px;font-weight:700;line-height:1.4}
.rfxgap .why{display:block;font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.5}
.rfxgap .acdo{margin-top:9px;padding-top:9px}
.tchip.rfx{background:rgba(74,58,167,.15);color:#4A3AA7}
:root[data-t="dark"] .tchip.rfx{background:rgba(144,133,233,.18);color:#9085E9}

/* ── SOW builder ── */
.dwh.sow .bgg,.dwh.sow{background:linear-gradient(105deg,#1D3251 0%,#34718C 52%,#2E7D5B 100%)}
.sowbrand{display:flex;gap:12px;align-items:flex-end}
.sowlogo{width:112px;height:66px;border:2px dashed var(--line);border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;background:var(--sunk);color:var(--ink-3);flex:none;transition:.14s}
.sowlogo:hover{border-color:var(--acc);color:var(--acc)}
.sowlogo span{font-size:10px;font-weight:600}
.sowlogo.has{border-style:solid;border-color:var(--acc);background:var(--wash);color:var(--acc)}
.sowlogo.has b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.clz{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.clz.locked{border-color:rgba(46,125,91,.4);background:var(--ok-bg)}
.clzh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clzh b{font-size:12.5px;font-weight:700}
.clzedit{font-size:11px;font-weight:700;color:var(--acc)} .clzedit:hover{text-decoration:underline}
.lockb{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.03em;
  color:var(--ok);background:var(--surface);border:1px solid rgba(46,125,91,.35);border-radius:5px;padding:2px 7px}
.clz p{margin:6px 0 0;font-size:11.5px;color:var(--ink-2);line-height:1.55}
.clz.locked p{color:var(--ink)}
.clz u{text-decoration:none;font-weight:700;border-bottom:1.5px solid var(--acc)}
.pnl h4 .cnt,.ds h4 .cnt{display:inline-block;font-size:10px;font-weight:700;background:var(--wash);color:var(--acc);
  border-radius:999px;padding:1px 7px;margin-left:5px;letter-spacing:0;text-transform:none}
@media (max-width:560px){ .rfxstat{grid-template-columns:1fr 1fr} .rfxrow{grid-template-columns:1fr 70px 80px} }
</style>

.org{border:0;cursor:pointer}

const SLEN=(d,wi)=>stagesFor(d,wi).length;
const TOTAL_STAGES=d=>WS.reduce((s,w,i)=>s+SLEN(d,i),0);
function stagesFor(d,wi){
  const w=WS[wi];
  const withRfx=list=>(d&&d.rfx&&wi===0)?[list[0],list[1],RFX_STAGE,...list.slice(2)]:list;
  if(!d||d.type==='sw'||!d.type) return withRfx(w.stages);
  return withRfx(w.stages.map((s,i)=>{const o=AGENT_OVR[w.id+':'+i];
    if(!o) return s;
    if(d.type==='both') return {...s,...o,n:o.n+' + '+s.n.split(' ')[0].toLowerCase(),both:1};
    return {...s,...o};}));
}

function catalog(){
  const out=[]; const seen={};
  WS.forEach((w,wi)=>w.stages.forEach((s,si)=>s.as.forEach(a=>{
    const k=a.n;
    if(seen[k]){ seen[k].uses.push({wi,si,w,s}); return; }
    const it={t:a.t,n:a.n,m:a.m,g:w.name,p:tagProduct(a.n),uses:[{wi,si,w,s}]}; seen[k]=it; out.push(it);

}

/* ══════════ MILESTONE CELEBRATION ══════════ */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas'); c.className='confetti';
  c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  const x=c.getContext('2d'), cols=['#1D3251','#34718C','#DA7758','#54A4DB','#E5C179'], P=[];
  for(let i=0;i<140;i++)P.push({x:innerWidth*(0.2+0.6*(i/140)),y:innerHeight*0.42,
    vx:(i%17-8)*0.9, vy:-(6+(i%11)), w:5+(i%5), h:8+(i%7), r:(i%360)*Math.PI/180,
    vr:((i%7)-3)*0.12, c:cols[i%cols.length]});
  let f=0;
  (function tick(){
    f++; x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.vy+=0.34;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-f/110);
      x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(f<110)requestAnimationFrame(tick); else c.remove();
  })();
}

let WH_REC=null, WH_TARGET='', WH_SRC='typed', WH_BASE='';
function startWhisper(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const st=document.getElementById('micstate');
  if(!SR){ st.textContent=T('Microphone not available here — playing a sample instead');
    document.getElementById('micbtn').classList.remove('on'); return typeWhisper(WHISPER_DEMO); }
  WH_SRC='voice';
  try{
    WH_REC=new SR(); WH_REC.continuous=true; WH_REC.interimResults=true; WH_REC.lang=LANG==='es'?'es-MX':'en-US';
    let final='';
    WH_REC.onresult=ev=>{let t='';for(let i=ev.resultIndex;i<ev.results.length;i++){
      if(ev.results[i].isFinal)final+=ev.results[i][0].transcript; else t+=ev.results[i][0].transcript;}
      const ta=document.getElementById('whtx');
      ta.value=(WH_BASE?WH_BASE+' ':'')+final+t;
      document.getElementById('whcount').textContent=ta.value.trim().length+' '+T('characters');
      document.getElementById('whfile').disabled=ta.value.trim().length<12;};
    WH_REC.onerror=()=>{st.textContent=T('Microphone not available here — playing a sample instead');
      document.getElementById('micbtn').classList.remove('on'); typeWhisper(WHISPER_DEMO);};
    WH_REC.onend=()=>{document.getElementById('micbtn').classList.remove('on');
      st.textContent=T('Tap to talk — or just type below');
      const v=(document.getElementById('whtx').value||'').trim();
      if(v.length>=12) consolidate(v);};
    WH_BASE=(document.getElementById('whtx').value||'').trim();
    WH_REC.start(); document.getElementById('micbtn').classList.add('on');
    st.textContent=T('Listening — tap again to stop');
    document.getElementById('micbtn').onclick=()=>{try{WH_REC.stop()}catch(e){}};
  }catch(e){ st.textContent=T('Microphone not available here — playing a sample instead'); typeWhisper(WHISPER_DEMO); }
}

function noteCard(n,compact){
  return `<article class="note">
    <div class="nhd"><span class="nsrc ${n.src}">${sv(n.src==='voice'?I.mic:I.pen,11,2.2)}${E(n.src==='voice'?'Voice':'Typed')}</span>

function notesPanel(d){

/* ══════════ WHISPER → NOTES (tie-in) ══════════ */
function fileNote(text,dealId,wsId,stage,tags,src){
  const d=DEALS.find(x=>x.id===dealId)||DEALS[0];
  NOTES.unshift({id:'N-'+(109+NOTES.length),deal:d.id,ws:wsId||WS[d.ph].id,
    stage:(stage===undefined?Math.min(d.st[WS[d.ph].id],5):stage),
    ts:T('Just now'),src:src||'voice',t:text,tags:tags||['Captured']});
  return d;
}

/* ══════════ shared bits ══════════ */
const trArrow=t=>t>0?`<span class="tup">▲</span>`:t<0?`<span class="tdn">▼</span>`:`<span class="tfl">■</span>`;
const heat=v=>v>=80?'h4':v>=65?'h3':v>=50?'h2':'h1';

/* period selector — scopes achieved metrics and the trend */
function periodBar(lab,note){
  return `<div class="perbar">
    <div class="perleft"><span class="kick">${E('The number')}</span>
      <span class="perlab">${E(lab)}</span><span class="pernote">${E(note)}</span></div>
    <div class="perseg" role="group" aria-label="${Er(T('Period'))}">
      ${PERIODS.map(p=>`<button class="${PERIOD===p.k?'on':''}" data-period="${p.k}" aria-pressed="${PERIOD===p.k}">${E(p.l)}</button>`).join('')}
    </div></div>`;
}

/* the headline metric: value, plan, progress with an expected-pace marker */
function bigMet(m){
  const behind=m.pct<m.pace-2;
  return `<div class="bm ${behind?'behind':''}">
    <div class="bml">${E(m.l)}</div>
    <div class="bmv num">${m.v}<i>${E(m.u)}</i></div>
    <div class="bmp">${E(m.plan)}</div>
    <div class="bmt"><i style="width:${m.pct}%"></i><span class="pace" style="left:${m.pace}%" title="${Er(T('Expected by today'))}"></span></div>
    <div class="bmf"><span class="bmpct num">${m.pct}%</span>
      <span class="bmd ${m.dg>0?'up':m.dg<0?'dn':''}">${E(m.d)}</span></div></div>`;
}
const bigRow=(arr,kick,note)=>`<div class="glabel"><span class="kick">${E(kick)}</span><span class="fresh">${E(note)}</span></div>
  <div class="bmrow">${arr.map(bigMet).join('')}</div>`;

/* pipeline block — sliced by expected close date */
function pipeBlock(P){
  const mx=Math.max(...P.stages.map(s=>s.v));
  const ok=P.cov>=P.need;
  const f=n=>'$'+(n>=10?n.toFixed(1):n.toFixed(2))+'M';
  return `<div class="sh"><h2>${E('Pipeline closing in')} ${E(P.lab)}</h2>
      <span class="hint">${E('Sliced by expected close date. Coverage, shape and movement for the period you selected.')}</span></div>
    <div class="pipegrid">
      <div class="card pad covcard ${ok?'':'short'}">
        <div class="covtop"><div><div class="bml">${E('Coverage of the')} ${E(P.lab)} ${E('target')}</div>
          <div class="covv num">${P.cov.toFixed(1)}<i>×</i></div>
          <div class="bmp">${E('need')} ${P.need.toFixed(1)}× · ${E('target')} ${f(P.tgt)}</div></div>
          <div class="covtot"><span>${E('Closing in')} ${E(P.lab)}</span><b class="num">${f(P.close)}</b></div></div>
        <div class="covbar"><i style="width:${Math.min(100,P.cov/P.need*100)}%"></i><span class="covneed"></span></div>
        <div class="covnote">${ok?E('Above requirement'):E('Short of requirement — the gap is registrations, not conversion')}</div>
        <div class="pslice">
          <div class="psr"><span>${E('Still to book this period')}</span><b class="num">${f(P.rem)}</b></div>
          <div class="psr"><span>${E('Closing after')} ${E(P.lab)}</span><b class="num dim">${f(P.beyond)}</b></div>
        </div>
        <div class="nlr"><div class="nlrl">${E('New-logo share of this slice')}</div>
          <div class="nlrt"><i style="width:${P.newlogo}%"></i></div>
          <div class="nlrv num">${P.newlogo}%</div></div>
      </div>
      <div class="card pad"><h3 class="ch">${E('Where that slice sits')}</h3>
        <p class="cs">${E('Deals expected to close in the period, by the stage they are in today.')}</p>
        <div style="margin-top:12px">${P.stages.map((s,i)=>`<div class="stgrow">
          <div class="stgl">${E(s.s)}</div>
          <div class="stgt"><i style="width:${Math.round(s.v/mx*100)}%;background:${['var(--teal)','var(--sky)','var(--gold)','var(--coral)'][i]}"></i></div>
          <div class="stgv num">${f(s.v)}</div></div>`).join('')}</div>
        <div class="movrow">${P.move.map(m=>`<div class="mov ${m.t}">
          <span>${E(m.l)}</span><b class="num">${Er(m.v)}</b></div>`).join('')}</div>
        <div class="covnote">${E('Movement in')} ${E(P.lab)}</div>
      </div>
    </div>`;
}
const insightCards=(arr,title,hint)=>`<div class="sh"><h2>${E(title)}</h2><span class="hint">${E(hint)}</span></div>
  <div class="insg">${arr.map(x=>`<article class="actc ${x.sev}">
    <div class="acp"><span class="sevtag ${x.sev}">${E(x.sev)}</span></div>
    <h4>${E(x.t)}</h4><p>${E(x.b)}</p>
    <div class="acdo">${sv(I.arrow,12,2.6)}<span>${E(x.a)}</span></div></article>`).join('')}</div>`;

function trendCard(P,title,sub){
  const mx=Math.max(...P.trend), W=560,H=176,ml=30,mb=28;
  const px=i=>ml+(W-ml*2)*i/(P.trend.length-1), py=v=>H-mb-(H-mb-34)*(v/mx);
  const line=P.trend.map((v,i)=>`${i?'L':'M'}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  return `<div class="card pad trendcard"><h3 class="ch">${Er(title)}</h3><p class="cs">${Er(sub)}</p>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;height:auto;margin-top:8px" role="img"
      aria-label="${Er(title)}">
      <path d="${line} L${px(P.trend.length-1)},${H-mb} L${px(0)},${H-mb} Z" fill="var(--teal)" opacity=".10"/>
      <path d="${line}" fill="none" stroke="var(--teal)" stroke-width="2.2" stroke-linejoin="round"/>
      ${P.trend.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="3.4" fill="var(--teal)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
      <text x="${px(P.trend.length-1)-6}" y="${py(mx)-12}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${Er(P.tmax)}</text>
      ${P.lbl.map((l,i)=>`<text x="${px(i)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">${Er(l)}</text>`).join('')}
    </svg></div>`;
}

/* ══════════ RFx RESPONSE AGENT ══════════ */
const RFX_REQ=[
 {c:'Asset management',n:42,auto:39,g:3},
 {c:'Maintenance planning',n:31,auto:29,g:2},
 {c:'Mobile & offline',n:18,auto:14,g:4},
 {c:'Integration & APIs',n:24,auto:19,g:5},
 {c:'Security & compliance',n:36,auto:36,g:0},
 {c:'Implementation & support',n:22,auto:18,g:4},
 {c:'Commercial & licensing',n:14,auto:11,g:3}];
const RFX_GAPS=[
 {q:'Describe offline data capture on ATEX-rated handhelds in a wet environment.',
  w:'No approved answer. Closest match is generic mobile offline — scored 0.41.',a:'Ask Aptean product for a written position'},
 {q:'Provide three references in Latin American canned-goods manufacturing.',
  w:'Two references on file, one is under NDA and cannot be named.',a:'Request a reference release, or substitute Brasil Fábrica'},

let RFXS=0;
function openRfx(){
  const d=DEALS.find(x=>x.id===S.deal)||DEALS[0];
  const tot=RFX_REQ.reduce((s,r)=>s+r.n,0), au=RFX_REQ.reduce((s,r)=>s+r.auto,0);
  const pct=Math.round(au/tot*100);
  showDW(`<div class="dwh rfx"><button class="x" data-x aria-label="Close">${sv('<path d="M6 6l12 12M18 6L6 18"/>',14,2.4)}</button>
      <div class="k">${Er(d.cu)} · ${Er(d.rfx||'RFP')}</div><h2>${E('RFx response agent')}</h2>
      <p style="margin:9px 0 0;font-size:12.5px;color:rgba(255,255,255,.84);max-width:48ch;position:relative">
        ${E('Upload the document. It extracts every requirement, answers what it can from the approved library, and hands you only what it cannot.')}</p></div>
    <div class="dwb">
      ${RFXS===0?`
        <div class="rfxdrop" data-rfxgo="1">
          <span class="rfxi">${sv(I.doc,26,1.8)}</span>
          <b>${E('Drop the RFI or RFP here')}</b>
          <span>${E('PDF, Word or Excel. Most run 60–200 requirements.')}</span>
          <span class="btn g" style="margin-top:14px">${E('Run the agent')}</span>
        </div>
        <div class="auto" style="margin:0"><span class="z">${sv(I.zap,12,0).replace('fill="none"','fill="currentColor" stroke="none"')}</span>
          <span><b>${E('Why this sits before discovery:')}</b> ${E('An RFx arrives unshaped and on someone else’s deadline. Getting through it fast is what buys you the discovery conversation.')}</span></div>`
      :`
        <div class="rfxstat">
          <div><span>${E('Requirements found')}</span><b class="num">${tot}</b></div>
          <div><span>${E('Answered from library')}</span><b class="num">${au}</b><i>${pct}%</i></div>
          <div class="hot"><span>${E('Needs you')}</span><b class="num">${tot-au}</b></div>
          <div><span>${E('Time to first draft')}</span><b class="num">6<em>min</em></b></div>
        </div>
        <div class="ds"><h4>${E('Coverage by section')}</h4>
          ${RFX_REQ.map(r=>`<div class="rfxrow"><div class="rfxc">${E(r.c)}</div>
            <div class="rfxt"><i style="width:${Math.round(r.auto/r.n*100)}%"></i></div>
            <div class="rfxv"><b class="num">${r.auto}/${r.n}</b>${r.g?`<span class="gap">${r.g} ${E('gaps')}</span>`:`<span class="ok">${E('complete')}</span>`}</div></div>`).join('')}
        </div>
        <div class="ds"><h4>${E('What it could not answer')} <span class="cnt">${RFX_GAPS.length}</span></h4>
          ${RFX_GAPS.map(g=>`<div class="rfxgap"><b>${E(g.q)}</b>
            <span class="why">${E(g.w)}</span>
            <span class="acdo">${sv(I.arrow,12,2.6)}<span>${E(g.a)}</span></span></div>`).join('')}
        </div>
        <div class="auto" style="margin:0"><span class="z">${sv(I.zap,12,0).replace('fill="none"','fill="currentColor" stroke="none"')}</span>
          <span><b>${E('Automated:')}</b> ${E('Answers are pulled only from the approved library, versioned and dated. Nothing is invented — an unanswerable requirement is shown as a gap rather than filled with something plausible.')}</span></div>
        <div class="cta"><button class="btn g" data-x>${E('Assemble the response')}</button>
          <button class="btn s" data-sugg="Draft the three RFP gap answers">${E('Ask Partner AI for the gaps')}</button></div>`}
    </div>`);

  if(dz) dz.onclick=()=>{ dz.innerHTML=`<span class="rfxi spin">${sv(I.zap,26,0).replace('fill="none"','fill="currentColor" stroke="none"')}</span>
      <b>${E('Reading the document…')}</b><span>${E('Extracting requirements and matching the answer library')}</span>`;
    setTimeout(()=>{RFXS=1;openRfx();},1400); };
}
